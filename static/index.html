<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Firewall | Active Protection</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-safe { color: #4ade80; }
        .status-danger { color: #f87171; }
        .loader {
            border-top-color: #3498db;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .json-out {
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="min-h-screen bg-[url('https://grainy-gradients.vercel.app/noise.svg')]">
    
    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <i data-lucide="shield-check" class="text-blue-400 w-8 h-8"></i>
                    <span class="text-xl font-bold tracking-wide">LLM <span class="gradient-text">Firewall</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <div id="connection-status" class="flex items-center gap-2 text-xs font-medium px-3 py-1 rounded-full bg-slate-800 border border-slate-700">
                        <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                        Connecting...
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Left Column: Input -->
        <div class="space-y-6">
            
            <!-- Prompt Scanner -->
            <section class="glass-panel rounded-2xl p-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="p-2 bg-blue-500/10 rounded-lg">
                        <i data-lucide="scan-line" class="text-blue-400"></i>
                    </div>
                    <h2 class="text-lg font-semibold">Prompt Scanner</h2>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Input Prompt</label>
                        <textarea id="promptInput" rows="5" 
                            class="w-full bg-slate-950/50 border border-slate-700 rounded-xl p-4 text-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-none placeholder-slate-600"
                            placeholder="Enter the user prompt to analyze... (e.g., 'Ignore previous instructions...')"></textarea>
                    </div>
                    
                    <button onclick="checkPrompt()" id="btnCheck"
                        class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl font-medium text-white shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="shield-alert"></i>
                        Scan Prompt
                    </button>
                    
                    <div class="flex items-center justify-between text-xs text-slate-500 px-1">
                        <span>Model Analysis: Enabled</span>
                        <span>Rule Engine: Active</span>
                    </div>
                </div>
            </section>

            <!-- Response Filter -->
            <section class="glass-panel rounded-2xl p-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="p-2 bg-purple-500/10 rounded-lg">
                        <i data-lucide="filter" class="text-purple-400"></i>
                    </div>
                    <h2 class="text-lg font-semibold">Response Filter</h2>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">LLM Response</label>
                        <textarea id="responseInput" rows="4" 
                            class="w-full bg-slate-950/50 border border-slate-700 rounded-xl p-4 text-slate-200 focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all resize-none placeholder-slate-600"
                            placeholder="Enter the LLM response to check for PII/Secrets..."></textarea>
                    </div>
                    
                    <button onclick="filterResponse()" id="btnFilter"
                        class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-medium text-slate-300 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="eraser"></i>
                        Filter & Redact
                    </button>
                </div>
            </section>

        </div>

        <!-- Right Column: Analysis -->
        <div class="space-y-6">
            
            <!-- Analysis Result -->
            <section class="glass-panel rounded-2xl p-6 min-h-[500px] flex flex-col">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-green-500/10 rounded-lg">
                            <i data-lucide="activity" class="text-green-400"></i>
                        </div>
                        <h2 class="text-lg font-semibold">Analysis Report</h2>
                    </div>
                    <span id="scoreBadge" class="hidden px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-slate-800 text-slate-400">
                        Waiting
                    </span>
                </div>

                <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-slate-600">
                    <i data-lucide="radar" class="w-16 h-16 mb-4 opacity-50"></i>
                    <p>Ready to scan prompts or responses</p>
                </div>

                <div id="loadingState" class="hidden flex-1 flex flex-col items-center justify-center text-blue-400">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-12 w-12 mb-4"></div>
                    <p class="animate-pulse">Analyzing content matrix...</p>
                </div>

                <div id="resultContent" class="hidden space-y-6">
                    
                    <!-- Verdict -->
                    <div class="text-center p-6 rounded-xl bg-slate-950/50 border border-slate-800">
                        <h3 class="text-sm font-medium text-slate-400 uppercase tracking-widest mb-2">Verdict</h3>
                        <div id="verdictText" class="text-3xl font-bold text-white mb-1">--</div>
                        <div id="confidenceBar" class="w-full max-w-xs mx-auto h-1.5 bg-slate-800 rounded-full mt-3 overflow-hidden">
                            <div id="confidenceLevel" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <p id="confidenceText" class="text-xs text-slate-500 mt-2">Confidence: 0%</p>
                    </div>

                    <!-- Details Box -->
                    <div class="space-y-3">
                        <h4 class="text-sm font-medium text-slate-300">Detection Details</h4>
                        <div id="detailsGrid" class="grid grid-cols-1 gap-3">
                            <!-- Dynamic Content -->
                        </div>
                    </div>

                    <!-- JSON Raw -->
                    <div class="mt-auto pt-4 border-t border-slate-800">
                        <details class="group">
                            <summary class="flex items-center gap-2 cursor-pointer text-xs text-slate-500 hover:text-slate-300 transition-colors">
                                <i data-lucide="code" class="w-3 h-3"></i> View Raw Response
                            </summary>
                            <pre id="rawJson" class="mt-3 p-3 bg-slate-950 rounded-lg text-xs text-slate-400 overflow-x-auto json-out"></pre>
                        </details>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script>
        lucide.createIcons();
        const BASE_URL = window.location.origin;

        // Check Health on Load
        checkHealth();

        async function checkHealth() {
            try {
                const res = await fetch(`${BASE_URL}/health`);
                if(res.ok) {
                    const data = await res.json();
                    const el = document.getElementById('connection-status');
                    el.className = "flex items-center gap-2 text-xs font-medium px-3 py-1 rounded-full bg-green-500/10 text-green-400 border border-green-500/20";
                    el.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500"></span>System Online (${data.ml_models_loaded} ML Models)`;
                }
            } catch(e) {
                const el = document.getElementById('connection-status');
                el.className = "flex items-center gap-2 text-xs font-medium px-3 py-1 rounded-full bg-red-500/10 text-red-400 border border-red-500/20";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span>Offline`;
            }
        }

        async function checkPrompt() {
            const prompt = document.getElementById('promptInput').value;
            if(!prompt) return;

            setLoading(true);
            
            try {
                const res = await fetch(`${BASE_URL}/check-prompt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, use_ml: true })
                });
                const data = await res.json();
                displayPromptResult(data);
            } catch(e) {
                console.error(e);
                alert("Error calling API");
            } finally {
                setLoading(false);
            }
        }

        async function filterResponse() {
            const response = document.getElementById('responseInput').value;
            if(!response) return;

            setLoading(true);

            try {
                const res = await fetch(`${BASE_URL}/filter-response`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ response, redact: true })
                });
                const data = await res.json();
                displayFilterResult(data);
            } catch(e) {
                console.error(e);
                alert("Error calling API");
            } finally {
                setLoading(false);
            }
        }

        function setLoading(isLoading) {
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('resultContent').classList.add('hidden');
            
            if(isLoading) {
                document.getElementById('loadingState').classList.remove('hidden');
            } else {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('resultContent').classList.remove('hidden');
            }
        }

        function displayPromptResult(data) {
            const isMalicious = data.is_malicious;
            const badge = document.getElementById('scoreBadge');
            const verdict = document.getElementById('verdictText');
            const confBar = document.getElementById('confidenceLevel');
            const confText = document.getElementById('confidenceText');
            const details = document.getElementById('detailsGrid');

            // Set Verdict
            badge.classList.remove('hidden');
            if(isMalicious) {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-red-500/20 text-red-500 border border-red-500/20";
                badge.innerText = "Threat Detected";
                verdict.innerText = "MALICIOUS";
                verdict.className = "text-3xl font-bold text-red-500 mb-1 tracking-tight";
                confBar.className = "h-full bg-red-500 transition-all duration-500";
            } else {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-green-500/20 text-green-500 border border-green-500/20";
                badge.innerText = "Safe";
                verdict.innerText = "SAFE TO PROCESS";
                verdict.className = "text-3xl font-bold text-green-500 mb-1 tracking-tight";
                confBar.className = "h-full bg-green-500 transition-all duration-500";
            }

            // Confidence
            const confPercent = Math.round(data.confidence * 100);
            confBar.style.width = `${confPercent}%`;
            confText.innerText = `AI Confidence Score: ${confPercent}%`;

            // Details
            let detailsHtml = '';
            
            // Rules
            const rules = data.detection_methods.rules;
            if(rules) {
                detailsHtml += createDetailItem('Rule Engine', rules.is_malicious ? 'Blocked' : 'Pass', rules.is_malicious);
                if(rules.keyword_injection?.detected) 
                    detailsHtml += createDetailItem('Keyword Injection', `Found: ${rules.keyword_injection.keywords.join(', ')}`, true);
                if(rules.sensitive_patterns?.detected) 
                    detailsHtml += createDetailItem('Sensitive Patterns', `Found: ${rules.sensitive_patterns.patterns.join(', ')}`, true);
            }

            // ML Models
            Object.keys(data.detection_methods).forEach(key => {
                if(key.startsWith('ml_')) {
                    const mod = data.detection_methods[key];
                    const isBad = mod.prediction === 1;
                    detailsHtml += createDetailItem(
                        key.replace('ml_', 'Model: ').replace('_', ' '), 
                        isBad ? 'Flagged' : 'Clear', 
                        isBad
                    );
                }
            });

            details.innerHTML = detailsHtml;
            document.getElementById('rawJson').innerText = JSON.stringify(data, null, 2);
        }

        function displayFilterResult(data) {
            const isSafe = data.is_safe;
            const badge = document.getElementById('scoreBadge');
            const verdict = document.getElementById('verdictText');
            const details = document.getElementById('detailsGrid');
            const confBar = document.getElementById('confidenceLevel');
            const confText = document.getElementById('confidenceText');

            badge.classList.remove('hidden');
            if(!isSafe) {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-amber-500/20 text-amber-500 border border-amber-500/20";
                badge.innerText = "Data Leakage";
                verdict.innerText = "SENSITIVE INFO";
                verdict.className = "text-3xl font-bold text-amber-500 mb-1 tracking-tight";
                confBar.className = "h-full bg-amber-500 transition-all duration-500";
            } else {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-green-500/20 text-green-500 border border-green-500/20";
                badge.innerText = "Clean";
                verdict.innerText = "SAFE RESPONSE";
                verdict.className = "text-3xl font-bold text-green-500 mb-1 tracking-tight";
                confBar.className = "h-full bg-green-500 transition-all duration-500";
            }

            const scorePercent = Math.round(data.leakage_score * 100);
            confBar.style.width = `${scorePercent}%`;
            confText.innerText = `Leakage Score: ${scorePercent}%`;

            let detailsHtml = '';
            if(data.info_types && data.info_types.length > 0) {
                detailsHtml += createDetailItem('Leak Type', data.info_types.join(', '), true);
            }
            if(data.redacted_text) {
                 detailsHtml += `
                 <div class="p-3 bg-slate-900/50 rounded-lg border border-slate-700">
                    <div class="text-xs text-slate-500 uppercase mb-1">Redacted Output</div>
                    <div class="text-sm text-slate-300 font-mono break-all">${escapeHtml(data.redacted_text)}</div>
                 </div>`;
            }

            details.innerHTML = detailsHtml;
            document.getElementById('rawJson').innerText = JSON.stringify(data, null, 2);
        }

        function createDetailItem(label, value, isBad) {
            const colorClass = isBad ? 'text-red-400' : 'text-green-400';
            const icon = isBad ? 'alert-triangle' : 'check-circle';
            return `
            <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg border border-slate-800">
                <span class="text-sm text-slate-400">${label}</span>
                <span class="text-sm font-medium ${colorClass} flex items-center gap-2">
                    ${value}
                    <i data-lucide="${icon}" class="w-4 h-4"></i>
                </span>
            </div>
            `;
        }
        
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
