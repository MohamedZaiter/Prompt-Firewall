version: '3.8'

services:
  # FastAPI service
  api:
    build: .
    container_name: prompt-firewall-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    command: python api.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit UI service
  streamlit:
    build: .
    container_name: prompt-firewall-ui
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run app_streamlit.py
    restart: unless-stopped
    depends_on:
      - api

  # Training service (optional, run on-demand)
  trainer:
    build: .
    container_name: prompt-firewall-trainer
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: python train_models.py
    profiles:
      - training

volumes:
  models:
  data:
  logs:
